name: Android release (Play Store internal testing)

# Manual only - publishing to Play Store, even to an internal testing
# track, is a deliberate action, not something that should fire on every
# push the way android-build.yml's debug build does. Run this from the
# Actions tab ("Run workflow") once ready to ship a new internal build.
on:
  workflow_dispatch:

jobs:
  release:
    name: Build signed app bundle and publish to Play internal testing
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install compileSdk platform and build tools
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Write local.properties
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
        run: |
          {
            echo "SUPABASE_URL=${SUPABASE_URL}"
            echo "SUPABASE_PUBLISHABLE_KEY=${SUPABASE_PUBLISHABLE_KEY}"
          } > local.properties

      - name: Decode signing keystore
        env:
          MACROTRACK_KEYSTORE_BASE64: ${{ secrets.MACROTRACK_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$MACROTRACK_KEYSTORE_BASE64" ]; then
            echo "MACROTRACK_KEYSTORE_BASE64 is not set - skipping the rest of this workflow."
            echo "SKIP_RELEASE=true" >> "$GITHUB_ENV"
            exit 0
          fi
          echo "$MACROTRACK_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/macrotrack-release.keystore"
          echo "MACROTRACK_KEYSTORE_PATH=$RUNNER_TEMP/macrotrack-release.keystore" >> "$GITHUB_ENV"

      - name: Cache Gradle
        if: env.SKIP_RELEASE != 'true'
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle*', 'gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      - name: Grant execute permission to gradlew
        if: env.SKIP_RELEASE != 'true'
        run: chmod +x ./gradlew

      - name: Build signed release app bundle
        if: env.SKIP_RELEASE != 'true'
        env:
          MACROTRACK_KEYSTORE_PASSWORD: ${{ secrets.MACROTRACK_KEYSTORE_PASSWORD }}
          MACROTRACK_KEY_ALIAS: ${{ secrets.MACROTRACK_KEY_ALIAS }}
          MACROTRACK_KEY_PASSWORD: ${{ secrets.MACROTRACK_KEY_PASSWORD }}
        run: ./gradlew :app:bundleRelease --no-daemon --stacktrace

      - name: Upload app bundle artifact
        if: env.SKIP_RELEASE != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: app-release-bundle
          path: app/build/outputs/bundle/release/*.aab

      - name: Publish to Play Store internal testing
        if: env.SKIP_RELEASE != 'true' && env.PLAY_SERVICE_ACCOUNT_JSON != ''
        env:
          PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: com.hybridmacro.app
          releaseFiles: app/build/outputs/bundle/release/app-release.aab
          track: internal
          status: completed
